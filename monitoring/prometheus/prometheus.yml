global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: kafka-brokers          # JMX exporter dentro de cada broker
    static_configs:
      - targets: ["kafka-1:7071", "kafka-2:7071"]
  - job_name: zookeeper              # JMX exporter dentro de ZooKeeper
    static_configs:
      - targets: ["zookeeper:7071"]
  - job_name: kafka-streams          # JMX exporter dentro de la app ventas-aggregator
    static_configs:
      - targets: ["streams:7071"]
  - job_name: kafka-exporter         # brokers, ISR, sub-replicadas, offsets y lag de consumer groups
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
